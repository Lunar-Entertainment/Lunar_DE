# Lunar DE Compositor Configuration (picom v10+)

backend = "xrender";
vsync = false;

# Rounded corners on windows and popups
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Soft drop shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.42;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Smooth open/close fade animations
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
log-level = "warn";
